<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>政策资料库 · 阳光学院计算机专业</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --surface:#ffffff; --surface2:#f3f4f5;
  --ink:#18181b; --ink2:#3f3f46; --muted:#71717a; --faint:#a1a1aa;
  --brand:#5e6ad2; --accent:#6366f1; --accent-hover:#4f46e5;
  --line:#e4e4e7; --line-subtle:#ececf0;
  --green:#059669; --amber:#b45309;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;background:
  radial-gradient(1100px 480px at 50% -220px, rgba(99,102,241,.08), transparent 60%),
  var(--bg)}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:30px 24px 24px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(99,102,241,.5),transparent)}
header h1{font-size:22px;font-weight:700;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
header h1::before{content:"▦";font-size:15px;background:linear-gradient(135deg,var(--brand),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{font-size:13px;color:var(--muted);margin-top:6px}
.stat{display:inline-block;background:rgba(99,102,241,.09);border:1px solid rgba(99,102,241,.22);border-radius:999px;padding:2px 12px;font-size:12px;color:var(--accent-hover);margin-left:8px;font-weight:600}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 4px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:#fff;color:var(--ink);transition:border .15s,box-shadow .15s}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.search::before{content:"⌕";position:absolute;left:14px;top:8px;font-size:16px;color:var(--faint)}
.btn{padding:9px 16px;border:1px solid var(--line);border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;transition:all .15s;background:#fff;color:var(--ink2)}
.btn:hover{border-color:var(--accent);color:var(--accent-hover)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#fff}
.btn-ghost{background:transparent}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tab{padding:7px 15px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;cursor:pointer;transition:all .15s;color:var(--muted);font-weight:600}
.tab:hover{border-color:var(--accent);color:var(--accent-hover)}
.tab.active{background:var(--brand);border-color:var(--brand);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin:8px 0 40px}
.card{background:#fff;border-radius:10px;padding:16px;border:1px solid var(--line);transition:transform .15s,border-color .15s,box-shadow .15s;display:flex;flex-direction:column;gap:8px}
.card:hover{transform:translateY(-2px);border-color:rgba(99,102,241,.45);box-shadow:0 0 0 1px rgba(99,102,241,.1),0 10px 30px rgba(24,24,27,.08)}
.card h3{font-size:15px;font-weight:600;line-height:1.45;letter-spacing:-.2px}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--accent-hover)}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;padding:2px 10px;border-radius:999px;background:rgba(99,102,241,.09);border:1px solid rgba(99,102,241,.2);color:var(--accent-hover);font-weight:600}
.tag.local{background:#fffbeb;border-color:#fde68a;color:var(--amber)}
.tag.src{background:#f4f4f5;color:var(--muted);font-weight:400;border-color:transparent}
.badge-new{background:#ecfdf5;border-color:#a7f3d0;color:var(--green)}
.card .desc{font-size:13px;color:var(--muted);line-height:1.55}
.card .foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--faint);border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0;font-size:14px}
.modal{display:none;position:fixed;inset:0;background:rgba(24,24,27,.4);backdrop-filter:blur(4px);z-index:50;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;width:92%;max-width:480px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px rgba(24,24,27,.15)}
.modal-box h2{font-size:17px;margin-bottom:16px;font-weight:700;letter-spacing:-.3px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;font-family:inherit;background:#fff;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.field textarea{resize:vertical;min-height:60px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
footer{text-align:center;color:var(--faint);font-size:12px;padding:20px 0 40px}
/* ── 本学年行动时间线 ── */
.tl{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0 2px}
.tl-head{display:flex;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tl-head h2{font-size:15px;font-weight:700;letter-spacing:-.3px}
.tl-head .tl-note{font-size:12px;color:var(--faint)}
.tl-track{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.tl-card{flex:0 0 172px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.tl-card.now{border-color:var(--accent);background:rgba(99,102,241,.05);box-shadow:0 0 0 1px rgba(99,102,241,.15)}
.tl-card .tl-m{font-size:12px;font-weight:700;color:var(--accent-hover);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.tl-card.now .tl-m::after{content:"本月";font-size:10px;background:var(--brand);color:#fff;border-radius:999px;padding:1px 7px;font-weight:600}
.tl-item{font-size:12px;line-height:1.45;margin-bottom:7px}
.tl-item b{display:block;font-size:12px;color:var(--ink);font-weight:600}
.tl-item b a{color:var(--ink);text-decoration:none}
.tl-item b a:hover{color:var(--accent-hover)}
.tl-item span{display:block;color:var(--muted);font-size:11px;line-height:1.4;margin-top:1px}
.tl-empty{color:var(--faint);font-size:12px}
@media(max-width:640px){header{padding:22px 16px}.wrap{padding:0 14px}.tl-card{flex:0 0 152px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>📋 政策资料库 <span class="stat" id="statAll">0 条</span></h1>
    <p>阳光学院 · 计算机专业 · 考公考研竞赛政策，随时查阅，可继续添加</p>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="search"><input id="q" type="text" placeholder="搜索政策关键词，如：助学贷款 / 蓝桥杯 / 考研…" oninput="render()"></div>
    <button class="btn btn-primary" onclick="openAdd()">＋ 添加政策</button>
    <button class="btn btn-ghost" onclick="exportData()">⬇ 导出</button>
    <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">⬆ 导入</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    <button class="btn btn-ghost" onclick="window.open('政策解读汇编.pdf')">📄 解读汇编 PDF</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <section class="tl" id="tl">
    <div class="tl-head"><h2>📅 本学年行动时间线</h2><span class="tl-note">2026.08 – 2027.07 · 竞赛/考试节点，具体日期以官网当年通知为准</span></div>
    <div class="tl-track" id="tlTrack"></div>
  </section>
  <div class="grid" id="grid"></div>
</div>

<div style="max-width:1100px;margin:0 auto;padding:0 20px 16px">
  <div style="text-align:center;padding:16px 20px;background:#eef2ff;border-radius:10px;font-size:13px;color:#4f46e5;line-height:1.6">
    📢 觉得有用？分享给同班同学吧！所有政策链接均来自官方渠道，可放心查阅。手动添加的政策可用「导出」备份，换设备后「导入」恢复。
  </div>
</div>
<footer>数据保存在本地浏览器（localStorage）· 分享给同学时优先使用网页链接</footer>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2>添加政策</h2>
    <div class="field"><label>标题 *</label><input id="f-title" placeholder="如：2026年蓝桥杯大赛通知"></div>
    <div class="field"><label>分类 *</label><select id="f-cat"></select></div>
    <div class="field"><label>链接 / 文件路径</label><input id="f-url" placeholder="https:// 网页链接 或 本地文件路径"></div>
    <div class="field"><label>备注</label><textarea id="f-desc" placeholder="重要时间、报考条件等备注…"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeAdd()">取消</button>
      <button class="btn btn-primary" onclick="saveAdd()">保存</button>
    </div>
  </div>
</div>

<script src="auto-policies.js"></script>

const CATS = ["全部","计算机专业","阳光学院","考研","考公","竞赛","证书","通用"];
const STORE_KEY = "policy_extra_v1";

function loadExtra(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||"[]")}catch(e){return[]}}
function saveExtra(a){localStorage.setItem(STORE_KEY,JSON.stringify(a))}
function allItems(){
  // 排序：自动抓取的最新在前（主要区域放新政策），其次内置，其次手动添加
  const auto = AUTO.map(x=>({t:x.t,c:x.c,u:x.u,d:x.d,auto:true,ts:x.ts||""}))
    .sort((a,b)=>(b.ts||"").localeCompare(a.ts||""));
  return auto.concat(BUILTIN).concat(loadExtra().map(x=>({t:x.title,c:x.cat,u:x.url,d:x.desc,user:true})));
}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function isLocal(u){return u&&!u.startsWith("http")}
function render(){
  const q=(document.getElementById("q").value||"").trim().toLowerCase();
  const active=document.querySelector(".tab.active");
  const cat=active?active.dataset.cat:"全部";
  const items=allItems().filter(i=>
    (cat==="全部" || (cat==="计算机专业" ? i.c.includes("计算机") : i.c.includes(cat))) &&
    (!q|| (i.t+" "+(i.d||"")+" "+i.c).toLowerCase().includes(q))
  );
  document.getElementById("statAll").textContent=allItems().length+" 条";
  const grid=document.getElementById("grid");
  if(!items.length){grid.innerHTML='<div class="empty">没有找到匹配的政策 — 试试其他关键词，或点击「添加政策」</div>';return}
  grid.innerHTML=items.map(i=>{
    const tag=i.user?'<span class="tag badge-new">自添加</span>':(i.auto?'<span class="tag badge-new">自动抓取</span>':"");
    const lo=isLocal(i.u)?'<span class="tag local">本地文件</span>':"";
    const link=i.u?`<a href="${esc(i.u)}" ${isLocal(i.u)?"":'target="_blank" rel="noopener"'}>${esc(i.t)}</a>`:esc(i.t);
    return `<div class="card"><h3>${link}</h3>
      <div class="meta"><span class="tag">${esc(i.c)}</span>${lo}${tag}</div>
      <div class="desc">${esc(i.d||"")}</div>
      <div class="foot"><span>${i.user?"我添加的":"内置"}</span><span>${isLocal(i.u)?"📁 本机文件":"🔗 网页链接"}</span></div>
    </div>`;
  }).join("");
}

function renderTimeline(){
  const now=new Date();
  const ym=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  document.getElementById("tlTrack").innerHTML=TIMELINE.map(g=>{
    const items=(g.items||[]).map(it=>
      `<div class="tl-item">${it.u?`<b><a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.t)}</a></b>`:`<b>${esc(it.t)}</b>`}<span>${esc(it.d||"")}</span></div>`).join("");
    return `<div class="tl-card${g.m===ym?" now":""}"><div class="tl-m">${g.m}</div>${items||'<div class="tl-empty">本月暂无安排</div>'}</div>`;
  }).join("");
}

function renderTabs(){
  const tabs=document.getElementById("tabs");
  tabs.innerHTML=CATS.map(c=>`<button class="tab${c==="全部"?" active":""}" data-cat="${c}" onclick="setTab(this)">${c}</button>`).join("");
}
function setTab(el){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");render();
}

function openAdd(){
  const sel=document.getElementById("f-cat");
  sel.innerHTML=CATS.filter(c=>c!=="全部").map(c=>`<option>${c}</option>`).join("");
  document.getElementById("modal").classList.add("show");
}
function closeAdd(){document.getElementById("modal").classList.remove("show")}
function saveAdd(){
  const title=document.getElementById("f-title").value.trim();
  const cat=document.getElementById("f-cat").value;
  const url=document.getElementById("f-url").value.trim();
  const desc=document.getElementById("f-desc").value.trim();
  if(!title){alert("标题不能为空");return}
  const extra=loadExtra();
  extra.push({title,cat,url,desc,ts:new Date().toISOString().slice(0,10)});
  saveExtra(extra);
  closeAdd();
  ["f-title","f-url","f-desc"].forEach(id=>document.getElementById(id).value="");
  render();
}
function exportData(){
  const data = {
    version: "1.0",
    exportDate: new Date().toISOString(),
    userPolicies: loadExtra(),
    autoPolicies: AUTO
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "政策库备份_"+new Date().toISOString().slice(0,10)+".json";
  a.click();
  URL.revokeObjectURL(url);
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const data = JSON.parse(ev.target.result);
      if(data.userPolicies && Array.isArray(data.userPolicies)){
        if(confirm("导入将合并到现有手动政策（共"+data.userPolicies.length+"条），是否继续？")){
          const existing = loadExtra();
          const merged = existing.concat(data.userPolicies);
          saveExtra(merged);
          render();
          alert("导入成功！当前手动政策共"+merged.length+"条");
        }
      } else {
        alert("文件格式不正确：缺少 userPolicies 字段");
      }
    } catch(err){
      alert("导入失败："+err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = "";
}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeAdd()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAdd()});
