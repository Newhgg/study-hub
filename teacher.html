<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老师后台 · 三班学习平台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f7fa;color:#1a1a1a}
.login-page{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#667eea,#764ba2)}
.login-box{background:#fff;padding:40px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.2);width:100%;max-width:400px}
.login-box h1{text-align:center;margin-bottom:8px;color:#333}
.login-box p{text-align:center;color:#888;margin-bottom:30px}
.login-box input{width:100%;padding:14px;border:2px solid #e0e0e0;border-radius:10px;font-size:15px;margin-bottom:16px}
.login-box button{width:100%;padding:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.app{display:none;max-width:1200px;margin:0 auto;padding:20px}
.header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:20px;border-radius:16px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.header h1{font-size:1.3em}
.header .sub{font-size:12px;opacity:.85;margin-top:4px}
.header-right{display:flex;align-items:center;gap:14px}
.status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#fbbf24;margin-right:5px}
.status-dot.on{background:#4ade80;box-shadow:0 0 6px #4ade80}
.status-dot.off{background:#f87171}
.status-txt{font-size:12px}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:10px 20px;background:#fff;border:2px solid #e0e0e0;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s}
.tab.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-color:transparent}
.tab:hover:not(.active){border-color:#667eea}
.panel{display:none}
.panel.active{display:block}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card h3{margin-bottom:12px;color:#333}
.btn{padding:10px 16px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-right:8px;display:inline-block}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.btn-success{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff}
.btn-danger{background:#ef4444;color:#fff}
.btn-secondary{background:#e5e7eb;color:#333}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-weight:600;margin-bottom:6px;font-size:14px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px}
.field-builder{background:#f8f9fa;padding:16px;border-radius:8px;margin-bottom:12px}
.field-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.field-row input{flex:1;min-width:120px}
.field-row select{width:120px}
.field-row button{padding:8px 12px;background:#ef4444;color:#fff;border:none;border-radius:6px;cursor:pointer}
.ai-box{background:linear-gradient(135deg,#f0f9ff,#e0f2fe);border:2px solid #bae6fd;padding:16px;border-radius:10px;margin-bottom:16px}
.ai-box h4{color:#0369a1;margin-bottom:8px}
.ai-box textarea{width:100%;padding:10px;border:2px solid #bae6fd;border-radius:8px;font-size:14px;min-height:70px;margin-bottom:8px}
.ai-result{background:#fff;padding:12px;border-radius:8px;margin-top:8px;font-size:13px;white-space:pre-wrap;font-family:monospace;display:none}
/* 表格 */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th,td{padding:10px;text-align:left;border-bottom:1px solid #e5e7eb;white-space:nowrap}
th{background:#f8f9fa;font-weight:600}
.truncate{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;padding:4px 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.badge-open{background:#dcfce7;color:#166534}
.badge-closed{background:#fee2e2;color:#991b1b}
.badge-warn{background:#fef3c7;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}
.badge-info{background:#e0f2fe;color:#075985}
.badge-ok{background:#dcfce7;color:#166534}
.empty{text-align:center;padding:40px;color:#999}
.empty-icon{font-size:48px;margin-bottom:12px}
.loading{display:inline-block;width:16px;height:16px;border:2px solid #f3f3f3;border-top:2px solid #667eea;border-radius:50%;animation:spin 1s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
/* 仪表盘 */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-top:4px solid #667eea}
.stat-card.green{border-top-color:#11998e}.stat-card.amber{border-top-color:#f59e0b}.stat-card.red{border-top-color:#ef4444}
.stat-num{font-size:30px;font-weight:700;color:#1a1a1a}
.stat-label{font-size:13px;color:#888;margin-top:4px}
.dash-section{background:#fff;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.dash-section h3{font-size:15px;margin-bottom:12px;color:#333}
.progress{height:8px;background:#e5e7eb;border-radius:6px;overflow:hidden;flex:1;min-width:80px}
.progress>div{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:6px;transition:width .4s}
.row-flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.recent-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed #e5e7eb;font-size:13px}
.recent-item:last-child{border-bottom:none}
.recent-dot{width:8px;height:8px;border-radius:50%;background:#667eea;flex:none}
.muted{color:#888;font-size:12px}
/* 聊天 */
.chat-layout{display:grid;grid-template-columns:240px 1fr;gap:16px}
@media(max-width:820px){.chat-layout{grid-template-columns:1fr}}
.chat-side{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);align-self:start}
.chat-side h4{font-size:14px;color:#333;margin-bottom:10px}
.chip{display:block;width:100%;text-align:left;padding:9px 12px;margin-bottom:8px;background:#f0f9ff;border:1.5px solid #bae6fd;border-radius:8px;font-size:12.5px;color:#075985;cursor:pointer;transition:all .15s}
.chip:hover{background:#e0f2fe;border-color:#7dd3fc}
.chip b{display:block;font-size:12.5px}
.chip span{color:#64748b;font-size:11px}
.chat-main{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;flex-direction:column;height:640px;max-height:70vh}
.chat-head{padding:14px 16px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chat-head b{font-size:14px}
.chat-box{flex:1;overflow-y:auto;padding:16px;background:#fafbfc}
.msg{display:flex;gap:10px;margin-bottom:14px}
.msg.user{flex-direction:row-reverse}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.msg.user .avatar{background:linear-gradient(135deg,#11998e,#38ef7d)}
.bubble{max-width:78%;padding:11px 14px;border-radius:12px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.ai .bubble{background:#fff;border:1px solid #e5e7eb;border-top-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.msg.user .bubble{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-top-right-radius:4px}
.bubble .btn{margin-top:8px}
.typing .bubble{color:#94a3b8}
.chat-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid #e5e7eb}
.chat-input-row input{flex:1;padding:11px 14px;border:2px solid #e0e0e0;border-radius:10px;font-size:14px}
.chat-input-row button{padding:11px 20px;border:none;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-weight:600;cursor:pointer}
.form-pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.form-pick button{padding:8px 12px;border:1.5px solid #667eea;background:#eef2ff;color:#4338ca;border-radius:8px;font-size:13px;cursor:pointer}
.form-pick button:hover{background:#e0e7ff}
/* 弹窗 */
.modal-mask{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:center;padding:16px}
.modal-mask.show{display:flex}
.modal-box{background:#fff;padding:24px;border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-box.wide{max-width:860px}
.modal-box h3{margin-bottom:16px}
.modal-close{float:right;border:none;background:#f1f5f9;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;color:#666}
.detail-table td:first-child{background:#f8f9fa;font-weight:600;width:130px;white-space:normal}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search-input{flex:1;min-width:200px;padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:13px}
/* toast */
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;z-index:2000;pointer-events:none;max-width:90%}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="login-page" id="loginPage">
  <div class="login-box">
    <h1>🔐 老师后台</h1>
    <p>三班学习平台 - 管理员登录</p>
    <input type="password" id="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">登录</button>
  </div>
</div>
<div class="app" id="app">
  <div class="header">
    <div>
      <h1>📋 老师后台</h1>
      <div class="sub"><span class="status-dot" id="statusDot"></span><span class="status-txt" id="statusTxt">检测服务中…</span></div>
    </div>
    <div class="header-right">
      <button class="btn btn-secondary btn-sm" onclick="refreshAll()">🔄 刷新</button>
      <button class="btn btn-secondary" onclick="logout()">退出</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('dash',this)">📊 仪表盘</div>
    <div class="tab" onclick="switchTab('forms',this)">📝 收集表</div>
    <div class="tab" onclick="switchTab('tasks',this)">📌 任务</div>
    <div class="tab" onclick="switchTab('ai',this)">🤖 AI 助手</div>
  </div>
  <!-- 仪表盘 -->
  <div class="panel active" id="panel-dash">
    <div class="stats-grid" id="dashStats"></div>
    <div id="dashBody"></div>
  </div>
  <!-- 收集表 -->
  <div class="panel" id="panel-forms">
    <div class="card">
      <h3>📝 收集表管理</h3>
      <button class="btn btn-primary" onclick="openCreateForm()">➕ 创建收集表</button>
      <button class="btn btn-secondary" onclick="openAiQuick()">🤖 AI 快速生成</button>
      <button class="btn btn-secondary" onclick="loadForms()">🔄 刷新</button>
    </div>
    <div class="card ai-box" id="aiQuickBox" style="display:none">
      <h4>🤖 AI 辅助创建表单</h4>
      <p style="font-size:13px;color:#64748b;margin-bottom:12px">用自然语言描述需求，AI（Ollama 本地模型）自动生成字段</p>
      <textarea id="aiFormPrompt" placeholder="例如：收集学生姓名、学号、手机号、家庭住址、是否住宿、家长电话"></textarea>
      <button class="btn btn-primary" onclick="aiCreateFormBox()">✨ 生成表单</button>
      <div class="ai-result" id="aiFormResult"></div>
    </div>
    <div id="formsList"></div>
  </div>
  <!-- 任务 -->
  <div class="panel" id="panel-tasks">
    <div class="card">
      <h3>📌 任务发布</h3>
      <button class="btn btn-primary" onclick="openCreateTask()">➕ 发布任务</button>
      <button class="btn btn-secondary" onclick="loadTasks()">🔄 刷新</button>
    </div>
    <div id="tasksList"></div>
  </div>
  <!-- AI 助手 -->
  <div class="panel" id="panel-ai">
    <div class="chat-layout">
      <div class="chat-side">
        <h4>💡 提示词模板（点一下直接发送）</h4>
        <div id="promptChips"></div>
        <div style="margin-top:14px">
          <h4 style="margin-bottom:8px">👥 班级名单（用于"谁还没交"）</h4>
          <textarea id="rosterInput" rows="4" style="width:100%;padding:8px;border:2px solid #e0e0e0;border-radius:8px;font-size:12.5px" placeholder="每行一个：姓名 或 学号，例如：&#10;张三&#10;李四&#10;2026001"></textarea>
          <button class="btn btn-secondary btn-sm" onclick="saveRoster()" style="margin-top:6px">💾 保存名单</button>
          <button class="btn btn-secondary btn-sm" onclick="askMissingFromRoster()" style="margin-top:6px">💬 问"谁还没交"</button>
        </div>
        <div style="margin-top:14px;padding-top:12px;border-top:1px dashed #e5e7eb">
          <label style="font-size:12.5px;color:#64748b;display:flex;align-items:center;gap:6px">
            <input type="checkbox" id="deepChatToggle"> 深度对话（需后端开通 /api/ai/chat，未开通自动回退）
          </label>
        </div>
      </div>
      <div class="chat-main">
        <div class="chat-head">
          <b>🤖 AI 助手</b>
          <span class="muted" id="aiCapTxt">可生成表单 · 整理数据 · 统计提交 · 查任务 · 谁还没交</span>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="chat-input-row">
          <input id="chatInput" placeholder="问我点什么，例如：帮我生成一份新生信息收集表" onkeydown="if(event.key==='Enter')chatSend()">
          <button onclick="chatSend()">发送</button>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- 创建表单弹窗 -->
<div class="modal-mask" id="createFormModal">
  <div class="modal-box">
    <h3>➕ 创建收集表</h3>
    <div class="form-group"><label>标题</label><input id="createFormTitle" placeholder="例如：学生信息收集"></div>
    <div class="form-group"><label>说明</label><textarea id="createFormDesc" rows="2" placeholder="填写说明"></textarea></div>
    <div class="form-group"><label>字段</label><div class="field-builder" id="formBuilderFields"></div></div>
    <button class="btn btn-primary" onclick="saveCreateForm()">✅ 保存</button>
    <button class="btn btn-secondary" onclick="closeModal('createFormModal')">取消</button>
  </div>
</div>
<!-- 创建任务弹窗 -->
<div class="modal-mask" id="createTaskModal">
  <div class="modal-box">
    <h3>📌 发布任务</h3>
    <div class="form-group"><label>标题</label><input id="taskTitle" placeholder="例如：收集学生联系方式"></div>
    <div class="form-group"><label>描述</label><textarea id="taskDesc" rows="3" placeholder="任务说明"></textarea></div>
    <div class="form-group"><label>截止时间</label><input type="date" id="taskDeadline"></div>
    <div class="form-group"><label>关联表单</label><select id="taskFormId"><option value="">无</option></select></div>
    <button class="btn btn-primary" onclick="saveCreateTask()">✅ 发布</button>
    <button class="btn btn-secondary" onclick="closeModal('createTaskModal')">取消</button>
  </div>
</div>
<!-- 提交详情弹窗 -->
<div class="modal-mask" id="detailModal">
  <div class="modal-box wide">
    <button class="modal-close" onclick="closeModal('detailModal')">✕</button>
    <h3 id="detailTitle">📄 提交详情</h3>
    <div id="detailMeta" class="muted" style="margin-bottom:12px"></div>
    <div class="table-wrap"><table class="detail-table" id="detailTable"></table></div>
    <div style="margin-top:14px">
      <button class="btn btn-secondary btn-sm" onclick="copyDetail()">📋 复制为文本</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
var FORMS_API = 'https://1234mac-studio.tail830780.ts.net';
var adminLoggedIn = localStorage.getItem('teacher_logged_in') === '1';
var formsApiOnline = false;
var C = { forms: [], tasks: [] };
var currentForm = null;       // 当前查看的表单详情
var currentSubmissions = [];  // 当前表单提交记录
var currentDetail = null;     // 当前详情提交
var formFields = [];
var aiFormData = null;
var chatHistory = [];
var chatDeepUnavailable = false;
var formGenLock = false;
// ============ 基础工具 ============
function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},2200); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function openModal(id){ document.getElementById(id).classList.add('show'); }
function fmtTime(s){ return s ? String(s).substring(0,16) : '-'; }
async function api(path, opts){
  var ctrl = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, 25000);
  try {
    var resp = await fetch(FORMS_API + path, Object.assign({mode:'cors', signal:ctrl.signal}, opts||{}));
    clearTimeout(timer);
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    return await resp.json();
  } catch(e){
    clearTimeout(timer);
    throw e;
  }
}
async function checkAPI(){
  try { await api('/api/forms'); formsApiOnline = true; }
  catch(e){ formsApiOnline = false; }
  var dot = document.getElementById('statusDot');
  var txt = document.getElementById('statusTxt');
  if(formsApiOnline){ dot.className='status-dot on'; txt.textContent='服务已连接'; }
  else { dot.className='status-dot off'; txt.textContent='服务未连接（检查 Mac 后端 / Tailscale）'; }
  return formsApiOnline;
}
function login(){
  var pwd = document.getElementById('password').value;
  if(pwd === 'admin2026'){
    localStorage.setItem('teacher_logged_in','1');
    adminLoggedIn = true;
    showApp();
  } else alert('密码错误');
}
function logout(){
  localStorage.removeItem('teacher_logged_in');
  adminLoggedIn = false;
  document.getElementById('app').style.display='none';
  document.getElementById('loginPage').style.display='flex';
  document.getElementById('password').value='';
}
function showApp(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('app').style.display='block';
  refreshAll();
}
function switchTab(tab, el){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
  el.classList.add('active');
  document.getElementById('panel-'+tab).classList.add('active');
  if(tab==='dash') loadDashboard();
  if(tab==='forms') loadForms();
  if(tab==='tasks') loadTasks();
  if(tab==='ai'){ ensureChat(); renderPrompts(); }
}
function refreshAll(){ checkAPI(); loadDashboard(); loadForms(); loadTasks(); }
// ============ 仪表盘 ============
async function loadDashboard(){
  var statsEl = document.getElementById('dashStats');
  var body = document.getElementById('dashBody');
  if(!formsApiOnline && !(await checkAPI())){
    body.innerHTML = '<div class="empty"><div class="empty-icon">🔌</div><p>后端服务未连接</p><p class="muted">请确认 Mac 上的服务已启动、Tailscale 在线，再点右上角刷新</p></div>';
    statsEl.innerHTML = '';
    return;
  }
  body.innerHTML = '<div class="empty"><div class="loading"></div> 加载中…</div>';
  var forms = []; var tasks = [];
  try { forms = (await api('/api/forms')).forms || []; } catch(e){}
  try { tasks = (await api('/api/tasks')).tasks || []; } catch(e){}
  C.forms = forms; C.tasks = tasks;
  var counts = {}; var recents = [];
  for(var i=0;i<forms.length;i++){
    var f = forms[i]; var subs = [];
    try { subs = (await api('/api/forms/'+f.id+'/submissions')).submissions || []; } catch(e){}
    counts[f.id] = subs.length;
    subs.slice(0,3).forEach(function(s){ recents.push({fid:f.id, ftitle:f.title, s:s}); });
  }
  recents.sort(function(a,b){ return String(b.s.created_at||'').localeCompare(String(a.s.created_at||'')); });
  var openForms = forms.filter(function(f){return f.status==='open';}).length;
  var totalSubs = Object.keys(counts).reduce(function(a,k){ return a + (typeof counts[k]==='number'?counts[k]:0); }, 0);
  statsEl.innerHTML =
    '<div class="stat-card"><div class="stat-num">'+forms.length+'</div><div class="stat-label">📋 收集表总数</div></div>' +

    var linked = t.form_id && counts[t.form_id]!=null ? counts[t.form_id] : null;

function deadlineBadge(d){
  if(!d) return '<span class="badge badge-closed">无截止</span>';
  var now = new Date(); now.setHours(0,0,0,0);
  var parts = d.split('-'); var dd = new Date(+parts[0], +parts[1]-1, +parts[2]);
  var days = Math.round((dd - now)/86400000);
  if(days < 0) return '<span class="badge badge-danger">⏰ 已逾期 '+(-days)+' 天</span>';
  if(days === 0) return '<span class="badge badge-danger">🚨 今天截止</span>';
  if(days === 1) return '<span class="badge badge-warn">明天截止</span>';
  if(days <= 3) return '<span class="badge badge-warn">剩 '+days+' 天</span>';
  return '<span class="badge badge-ok">剩 '+days+' 天</span>';
}

  {t:'📌 当前任务和截止时间', p:'当前有哪些任务，截止时间怎么样'},
  {t:'📥 导出数据', p:'导出{表单}的数据'}
];
function renderPrompts(){
  var el = document.getElementById('promptChips');
  if(el.dataset.rendered) return;
  el.dataset.rendered = '1';
  el.innerHTML = PROMPTS.map(function(pt){
    return '<button class="chip" onclick="sendTemplate('+PROMPTS.indexOf(pt)+')"><b>'+pt.t+'</b><span>'+esc(pt.p)+'</span></button>';
  }).join('');
}
function sendTemplate(i){
  var pt = PROMPTS[i]; if(!pt) return;
  var p = pt.p;
  // 需要选表单的模板，弹出选择
  if(p.indexOf('{表单}') >= 0){
    pickFormInChat(function(fid, ftitle){
      var text = p.split('{表单}').join(ftitle);
      chatSendText(text);
    });
    return;
  }
  chatSendText(p);
}
function ensureChat(){
  if(document.getElementById('chatBox').childElementCount) return;
  addMsg('ai', '你好，我是你的 **AI 助教** 👋\n\n我可以帮你：\n' +
    '· 用自然语言 **生成收集表**（真实调用本地 Ollama）\n' +
    '· **整理/汇总** 某张表的提交数据（Ollama 批量整理）\n' +
    '· **统计** 提交人数、谁交了、谁还没交（需先保存班级名单）\n' +
    '· 查看 **任务和截止时间**\n\n' +
    '左边有常用提示词模板，点一下就能用。也可以直接打字问我。');
  chatHistory = [];
}
function addMsg(role, html){
  var box = document.getElementById('chatBox');
  var div = document.createElement('div');
  div.className = 'msg ' + (role==='user'?'user':'ai');
  var avatar = role==='user' ? '👤' : '🤖';
  div.innerHTML = '<div class="avatar">'+avatar+'</div><div class="bubble">'+(role==='user'?esc(html).replace(/\n/g,'<br>'):html)+'</div>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}
function addTyping(){
  var box = document.getElementById('chatBox');
  var div = document.createElement('div');
  div.className = 'msg ai typing';
  div.id = 'typingMsg';
  div.innerHTML = '<div class="avatar">🤖</div><div class="bubble"><span class="loading"></span>思考中…</div>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}
function removeTyping(){ var t = document.getElementById('typingMsg'); if(t) t.remove(); }
function chatSend(){ chatSendText(document.getElementById('chatInput').value); }
function chatSendText(text){
  text = (text||'').trim();
  if(!text) return;
  document.getElementById('chatInput').value = '';
  addMsg('user', text);
  chatHistory.push({role:'user', content:text});
  aiRoute(text);
}
// 班级名单
function getRoster(){ try { return JSON.parse(localStorage.getItem('teacher_roster') || '[]'); } catch(e){ return []; } }
function saveRoster(){
  var raw = document.getElementById('rosterInput').value;
  var arr = raw.split(/\n|,|，|;|；/).map(function(s){ return s.trim(); }).filter(function(s){ return s; });
  localStorage.setItem('teacher_roster', JSON.stringify(arr));
  toast('💾 已保存 '+arr.length+' 人');
  addMsg('ai', '✅ 班级名单已保存（共 **'+arr.length+'** 人）。\n现在可以问我「谁还没交 XXX」啦。');
}
function loadRosterToChat(){
  var arr = getRoster();
  document.getElementById('rosterInput').value = arr.join('\n');
  addMsg('user', '查看班级名单');
  addMsg('ai', arr.length ? '当前名单共 **'+arr.length+'** 人：\n'+arr.join('、') : '名单还是空的。请在左侧输入班级名单（每行一个姓名或学号）后点「💾 保存名单」。');
}
function askMissingFromRoster(){
  var arr = getRoster();
  if(arr.length === 0){
    addMsg('user', '谁还没交？');
    addMsg('ai', '要判断"谁还没交"，需要先有班级名单。请在左侧「👥 班级名单」粘贴名单后点「💾 保存名单」，我再帮你比对。');
    return;
  }
  document.getElementById('rosterInput').value = arr.join('\n');
  chatSendText('对比班级名单，列出还没交的同学');
}
// 选择表单（聊天内）
function pickFormInChat(cb){
  var box = document.getElementById('chatBox');
  var div = addMsg('ai', '请选择要操作的收集表：');
  var pick = document.createElement('div');
  pick.className = 'form-pick';
  (C.forms||[]).forEach(function(f){
    var b = document.createElement('button');
    b.textContent = f.title;
    b.onclick = function(){ cb(f.id, f.title); };
    pick.appendChild(b);
  });
  div.querySelector('.bubble').appendChild(pick);
}
async function getFormsForChat(){
  try { C.forms = (await api('/api/forms')).forms || []; } catch(e){ C.forms = []; }
  return C.forms;
}
// 意图路由
async function aiRoute(text){
  var typing = addTyping();
  var reply = null;
  try {
    reply = await aiRouteInner(text);
  } catch(e){
    reply = '⚠️ 出错了：' + esc(e.message);
  }
  removeTyping();
  if(reply) addMsg('ai', reply);
}
async function aiRouteInner(text){
  var t = text;
  var low = t.toLowerCase();
  var forms = await getFormsForChat();
  // 1. 表单生成
  if(/生成|创建|做|建|弄|设计|搞|来一份/.test(t) && /表|收集|问卷|报名|登记|信息|名单/.test(t) && !/整理|统计|谁|导出/.test(t)){
    return await aiGenFormFromChat(t);
  }
  // 2. 数据整理（Ollama）
  if(/整理|汇总|归类|分析|清洗|去重/.test(t)){
    return await aiOrganizeFromChat(t, forms);
  }
  // 3. 任务 / 截止
  if(/任务|截止|到期|剩余|ddl|deadline/i.test(t)){
    return await aiTasksAnswer(t);
  }
  // 4. 谁还没交 / 名单对比
  if(/谁还没?交|还没?交|没交|未交|谁没|谁还?没/.test(t)){
    return await aiMissingAnswer(t, forms);
  }
  // 5. 统计提交 / 人数
  if(/统计|多少|人数|几个|提交率|交了|已交|几次|几份/.test(t) || /提交/.test(t)){
    return await aiStatsAnswer(t, forms);
  }
  // 6. 导出
  if(/导出|下载/.test(t) && /表|数据|csv/.test(t)){
    var f = await resolveForm(t, forms);
    if(!f) return '没有可导出的收集表。当前：\n' + forms.map(function(x,i){return (i+1)+'. '+x.title;}).join('\n');
    window.open(FORMS_API + '/api/forms/'+f.id+'/export','_blank');
    return '📥 已为你打开「'+f.title+'」的 CSV 导出，浏览器会下载文件。';
  }
  // 7. 深度对话（可选后端 /api/ai/chat）
  if(document.getElementById('deepChatToggle').checked && !chatDeepUnavailable){
    var deep = await aiDeepChat(text);
    if(deep) return deep;
  }
  // 8. 兜底引导
  return '我还没完全听懂 😅，目前我能做这些事：\n' +
    '· **生成收集表**：直接说「帮我生成一份XXX收集表」\n' +
    '· **整理数据**：说「整理某张表的提交数据」\n' +
    '· **统计**：说「统计某张表提交了几个人」\n' +
    '· **谁没交**：先在左侧保存班级名单，再问「谁还没交某张表」\n' +
    '· **任务**：问「当前有什么任务」\n\n' +
    '或者点左边 💡 提示词模板，一键发送。';
}
// 表单生成（聊天内）
async function aiGenFormFromChat(prompt){
  var typingNow = true;
  try {
    var start = Date.now();
    var data = await api('/api/ai/create-form', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({prompt:prompt})});
    var elapsed = ((Date.now()-start)/1000).toFixed(1);
    if(data.fields){
      aiFormData = {title:data.title||'AI 生成表单', description:data.description||'', fields:data.fields};
      var fieldList = data.fields.map(function(f,i){ return (i+1)+'. '+f.name+'（'+(f.required?'必填':'选填')+'）'; }).join('\n');
      var div = addMsg('ai', '✅ **表单生成成功**（'+elapsed+'s）\n\n**标题：**'+esc(aiFormData.title)+'\n\n**字段：**\n'+esc(fieldList)+'\n\n点下面的按钮可继续编辑后保存：');
      var b = document.createElement('button');
      b.className = 'btn btn-success btn-sm';
      b.textContent = '✅ 应用到收集表';
      b.onclick = function(){ aiApplyForm(); };
      div.querySelector('.bubble').appendChild(b);
      return null;
    }
    return '❌ 生成失败：' + esc(data.error||'AI 未返回字段');
  } catch(e){
    return '❌ 请求失败：'+esc(e.message)+'\n\n（超时可重试，9b 模型冷启动较慢；若提示连接失败，请确认 Mac 后端在线）';
  }
}
// 数据整理（聊天内）
async function aiOrganizeFromChat(t, forms){
  var f = await resolveForm(t, forms);
  if(!f) return '当前还没有可整理的收集表。';
  try {
    var data = await api('/api/forms/'+f.id+'/organize', {method:'POST'});
    return '✅ 「'+f.title+'」整理完成，共整理 **'+(data.organized||0)+'** 条记录。\n可以去「📝 收集表 → 查看数据」里看结果。';
  } catch(e){
    return '❌ 整理失败：'+esc(e.message)+'（可能是表单还没有提交数据，或后端 Ollama 未就绪）';
  }
}
// 任务回答
async function aiTasksAnswer(t){
  var tasks = [];
  try { tasks = (await api('/api/tasks')).tasks || []; } catch(e){}
  if(tasks.length===0) return '当前还没有发布任何任务。可以在「📌 任务」里发布。';
  var lines = tasks.map(function(x, i){
    var cd = '';
    if(x.deadline){
      var now = new Date(); now.setHours(0,0,0,0);
      var p = x.deadline.split('-'); var dd = new Date(+p[0], +p[1]-1, +p[2]);
      var days = Math.round((dd-now)/86400000);
      cd = days<0 ? '（已逾期 '+(-days)+' 天）' : days===0 ? '（今天截止！）' : '（剩 '+days+' 天）';
    }
    return (i+1)+'. '+x.title+'　截止：'+(x.deadline||'无')+cd;
  }).join('\n');
  return '📌 当前任务：\n' + lines;
}
// 谁还没交
async function aiMissingAnswer(t, forms){
  var roster = getRoster();
  if(roster.length===0){
    return '要判断"谁还没交"，我需要先知道班级名单。\n请在左侧「👥 班级名单」里粘贴名单（每行一个姓名或学号），点「💾 保存名单」，然后我再帮你比对。';
  }
  var f = await resolveForm(t, forms);
  if(!f) return '当前还没有可比对的收集表。';
  var subs = [];
  try { subs = (await api('/api/forms/'+f.id+'/submissions')).submissions || []; } catch(e){}
  var submitted = {};
  subs.forEach(function(s){ submitted[s.student_name] = true; if(s.student_id) submitted[s.student_id] = true; });
  var missing = roster.filter(function(r){ return !submitted[r]; });
  var done = roster.length - missing.length;
  if(missing.length===0) return '🎉 「'+f.title+'」全班 **'+roster.length+'** 人都交啦！';
  return '「'+f.title+'」已交 **'+done+'/'+roster.length+'** 人。\n\n还没交（'+missing.length+' 人）：\n'+missing.join('\n')+'\n\n提醒一下他们吧～';
}
// 统计提交
async function aiStatsAnswer(t, forms){
  var f = await resolveForm(t, forms);
  if(!f) return '当前还没有可统计的收集表。';
  var subs = [];
  try { subs = (await api('/api/forms/'+f.id+'/submissions')).submissions || []; } catch(e){}
  var roster = getRoster();
  var line = '📊 「'+f.title+'」\n\n· 已提交：**'+subs.length+'** 人';
  if(roster.length) line += ' / 名单 '+roster.length+' 人\n· 提交率：**'+Math.round(subs.length/roster.length*100)+'%**';
  else line += '\n· （保存班级名单后可以算提交率和未交名单）';
  if(subs.length){
    line += '\n\n最近提交：';
    subs.slice(-3).reverse().forEach(function(s){ line += '\n· '+esc(s.student_name||s.student_id||'匿名')+'（'+fmtTime(s.created_at)+'）'; });
  }
  return line;
}
// 从文本中解析表单：明确时直接返回，不明确时在聊天里弹出可点击选择
function resolveForm(t, forms){
  return new Promise(function(resolve){
    if(!forms || forms.length===0){ resolve(null); return; }
    if(forms.length===1){ resolve({id:forms[0].id, title:forms[0].title}); return; }
    var hit = forms.filter(function(f){ return t.indexOf(f.title) >= 0; });
    if(hit.length === 1){ resolve({id:hit[0].id, title:hit[0].title}); return; }
    var kw = ['新生','家长','报名','作业','离校','健康','信息','联系','登记','收集'];
    var k = forms.filter(function(f){ return kw.some(function(x){ return t.indexOf(x)>=0 && f.title.indexOf(x)>=0; }); });
    if(k.length === 1){ resolve({id:k[0].id, title:k[0].title}); return; }
    removeTyping();
    var div = addMsg('ai', '请选择要操作的收集表：');
    var pick = document.createElement('div');
    pick.className = 'form-pick';
    forms.forEach(function(f){
      var b = document.createElement('button');
      b.textContent = f.title;
      b.onclick = function(){ resolve({id:f.id, title:f.title}); };
      pick.appendChild(b);
    });
    div.querySelector('.bubble').appendChild(pick);
  });
}
// 深度对话（可选，后端需有 /api/ai/chat）
async function aiDeepChat(text){
  try {
    var data = await api('/api/ai/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({messages: chatHistory.slice(-12)})
    });
    return data.reply || data.content || data.message || null;
  } catch(e){
    chatDeepUnavailable = true;
    return null;
  }
}
