<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上课区域划分 3D · 合班座位</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f172a;color:#e2e8f0;}
  #stage{position:fixed;inset:0;}
  .hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.88);border:1px solid rgba(148,163,184,.35);border-radius:12px;padding:10px 16px;box-shadow:0 8px 30px rgba(0,0,0,.4);backdrop-filter:blur(8px);z-index:10;max-width:97vw;min-width:640px;}
  .hud h1{font-size:17px;margin:0 0 6px;text-align:center;letter-spacing:.5px;}
  .hud .sub{font-size:11px;color:#94a3b8;text-align:center;margin:0 0 8px;}
  .hud .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;}
  .hud button{padding:5px 11px;border:1px solid rgba(148,163,184,.4);border-radius:7px;background:rgba(30,41,59,.9);color:#e2e8f0;font-size:12px;cursor:pointer;}
  .hud button:hover{background:#334155;}
  .hud button.on{background:#2563eb;border-color:#3b82f6;color:#fff;}
  .hud .sep{width:1px;height:22px;background:rgba(148,163,184,.3);margin:0 4px;}
  .remind{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0;font-size:13px;font-weight:600;}
  .remind span{padding:4px 12px;border-radius:20px;white-space:nowrap;}
  .r1{background:rgba(59,130,246,.2);border:1px solid rgba(96,165,250,.6);color:#93c5fd;}
  .r2{background:rgba(239,68,68,.16);border:1px solid rgba(248,113,113,.6);color:#fca5a5;}
  .r3{background:rgba(245,158,11,.14);border:1px solid rgba(251,191,36,.55);color:#fcd34d;}
  .rn{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.5);color:#6ee7b7;}
  .params{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(148,163,184,.3);}
  .params.open{display:block;}
  .fld{display:flex;align-items:center;gap:4px;font-size:12px;color:#94a3b8;}
  .fld input[type=number]{width:48px;padding:4px 5px;border:1px solid rgba(148,163,184,.4);border-radius:6px;background:#1e293b;color:#e2e8f0;font-size:12px;text-align:center;}
  .fld input[type=text]{width:96px;padding:4px 5px;border:1px solid rgba(148,163,184,.4);border-radius:6px;background:#1e293b;color:#e2e8f0;font-size:12px;text-align:center;}
  .fld input.wide{width:170px;}
  .fld select{padding:4px 6px;border:1px solid rgba(148,163,184,.4);border-radius:6px;background:#1e293b;color:#e2e8f0;font-size:12px;}
  #info{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#94a3b8;background:rgba(15,23,42,.6);padding:5px 12px;border-radius:20px;z-index:10;white-space:nowrap;}
  #err{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#f87171;font-size:15px;z-index:99;display:none;text-align:center;background:rgba(0,0,0,.8);padding:20px 30px;border-radius:12px;border:1px solid #f87171;}
  html.clean .hud,html.clean #info{display:none !important;}
</style>
</head>
<body>
<div id="stage"></div>
<div id="err">3D 引擎加载失败</div>
<div class="hud" id="hud">
  <h1 id="title">计科 1班 + 2班 合班 · 座位划分</h1>
  <p class="sub" id="sub"></p>
  <div class="row" id="pairpick"></div>
  <div class="remind">
    <span class="r1" id="rem1tag">课前 10 分钟到教室</span>
    <span class="r2" id="rem2tag">课上禁止带饮料</span>
    <span class="r3" id="rem3tag">禁止迟到早退</span>
    <span class="rn" id="remNtag" style="display:none;"></span>
  </div>
  <div class="row">
    <button onclick="setView('overview')">全景</button>
    <button onclick="setView('front')">正面</button>
    <button onclick="setView('top')">俯视</button>
    <button id="rotBtn" onclick="toggleRotate()">旋转: 开</button>
    <span class="sep"></span>
    <button onclick="toggleParams()">调整参数</button>
    <button onclick="print3d()">打印</button>
  </div>
  <div class="params" id="params">
    <div class="row">
      <span class="fld">专业 <input id="major" type="text" value="计科"></span>
      <span class="fld">A班 <input id="va" type="number" min="1" max="20" value="1"></span>
      <span class="fld">B班 <input id="vb" type="number" min="1" max="20" value="2"></span>
      <span class="fld">门侧 <select id="door"><option value="left">左门</option><option value="right">右门</option></select></span>
      <span class="fld">区域数 <select id="z"><option value="2">2</option><option value="4" selected>4</option><option value="6">6</option><option value="8">8</option></select></span>
      <span class="fld">过道数 <select id="aisles"><option value="0">0</option><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option></select></span>
      <span class="fld">每块排数 <input id="rows" type="number" min="3" max="12" value="7"></span>
      <span class="fld">列数 <input id="cols" type="number" min="2" max="8" value="3"></span>
      <span class="fld">A人数 <input id="n1" type="number" min="1" max="120" value="40"></span>
      <span class="fld">B人数 <input id="n2" type="number" min="1" max="120" value="40"></span>
      <span class="fld">A号起 <input id="s1" type="number" min="1" value="1"></span>
      <span class="fld">B号起 <input id="s2" type="number" min="1" value="1"></span>
    </div>
    <div class="row" style="margin-top:7px;">
      <span class="fld">提醒1 <input id="rem1" type="text" value="课前 10 分钟到教室"></span>
      <span class="fld">提醒2 <input id="rem2" type="text" value="课上禁止带饮料"></span>
      <span class="fld">提醒3 <input id="rem3" type="text" value="禁止迟到早退"></span>
      <span class="fld">备注 <input id="note" class="wide" type="text" value="" placeholder="选填，如：按学号对号入座"></span>
    </div>
    <div class="row" style="margin-top:8px;"><button class="on" onclick="rebuild()">重新生成</button></div>
  </div>
</div>
<div id="info">拖拽旋转 · 滚轮缩放 ｜ 区域并排 · 学号小坐前排</div>
<script src="three.min.js"></script>
<script>
const PAIRS=[[1,2],[3,4],[5,6],[7,8]];
function qp(){const p=new URLSearchParams(location.search);
  return{a:+(p.get('a')||1),b:+(p.get('b')||2),door:p.get('door')==='right'?'right':'left',
    z:+(p.get('z')||4),aisles:+(p.get('aisles')!=null?p.get('aisles'):1),rows:+(p.get('rows')||7),cols:+(p.get('cols')||3),
    n1:+(p.get('n1')||40),n2:+(p.get('n2')||40),s1:+(p.get('s1')||1),s2:+(p.get('s2')||1),
    major:p.get('major')||'计科',rem1:p.get('rem1')||'课前 10 分钟到教室',rem2:p.get('rem2')||'课上禁止带饮料',rem3:p.get('rem3')||'禁止迟到早退',note:p.get('note')||'',clean:p.has('clean')};}
let scene,camera,renderer,orbit,autoRotateOn=true;
const COLORS={A:0x3b82f6,B:0xf97316,floor:0xf1f5f9,grid:0xcbd5e1,wall:0x64748b,blackboard:0x1e293b,wood:0x92400e};

function makeTextSprite(text,{size=1.1,color='#ffffff',bg='rgba(15,23,42,0.85)',pad=18,font='600 72px "PingFang SC","Microsoft YaHei",sans-serif'}={}){
  const cv=document.createElement('canvas');const ctx=cv.getContext('2d');
  ctx.font=font;const w=Math.ceil(ctx.measureText(text).width)+pad*2;const h=110;
  cv.width=Math.max(64,w);cv.height=h;
  const c2=cv.getContext('2d');c2.font=font;
  if(bg){c2.fillStyle=bg;roundRect(c2,2,2,cv.width-4,h-4,18);c2.fill();}
  c2.fillStyle=color;c2.textAlign='center';c2.textBaseline='middle';
  c2.fillText(text,cv.width/2,h/2);
  const tex=new THREE.CanvasTexture(cv);tex.needsUpdate=true;
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  spr.scale.set(size*(cv.width/cv.height)*0.9,size,1);
  return spr;
}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

function build(){
  const MAJ=major.value.trim()||'计科',A=+va.value,B=+vb.value,D=door.value;
  const Z=+z.value,R=+rows.value,C=+cols.value,G=Math.min(+aisles.value,Z-1);
  const N1=+n1.value,N2=+n2.value,S1=+s1.value,S2=+s2.value;
  const R1=rem1.value.trim()||'课前 10 分钟到教室',R2=rem2.value.trim()||'课上禁止带饮料',R3=rem3.value.trim()||'禁止迟到早退',NOTE=note.value.trim();
  const HB=Z/2,cap=R*C;
  document.getElementById('title').textContent=MAJ+' '+A+'班 + '+B+'班 合班 · 座位划分';
  document.getElementById('sub').textContent='阳光学院 · '+MAJ+' ｜ '+Z+'块区域 × '+R+'排×'+C+'列'+(G?' · '+G+'条过道':'')+' ｜ '+(D==='right'?'前门右前·后门右后':'前门左前·后门左后');
  document.getElementById('rem1tag').textContent=R1;
  document.getElementById('rem2tag').textContent=R2;
  document.getElementById('rem3tag').textContent=R3;
  const nt=document.getElementById('remNtag');nt.textContent=NOTE;nt.style.display=NOTE?'':'none';
  let pp='';for(const[x,y]of PAIRS)pp+='<button class="'+(A===x&&B===y?'on':'')+'" onclick="setPair('+x+','+y+')">'+x+'+'+y+'班</button>';
  document.getElementById('pairpick').innerHTML=pp;
  scene=new THREE.Scene();scene.background=new THREE.Color(0x0f172a);
  camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,0.1,400);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  const st=document.getElementById('stage');st.innerHTML='';st.appendChild(renderer.domElement);
  const hemi=new THREE.HemisphereLight(0xffffff,0x64748b,1.1);scene.add(hemi);
  const dir=new THREE.DirectionalLight(0xffffff,1.4);dir.position.set(18,30,12);scene.add(dir);

  const seatW=0.95,seatD=1.05,aisleW=1.7,gap=0.22,wallGap=1.3;
  const blockW=C*seatW,blockD=R*seatD;
  // 过道间隔编号：1..Z-1（i 表示块 i 与块 i+1 之间）
  let aisleIdx=[];
  if(G>0){
    const s=new Set();
    for(let i=1;i<=G;i++)s.add(Math.max(1,Math.min(Z-1,Math.round(i*(Z-1)/(G+1)))));
    let arr=[...s].sort((a,b)=>a-b);
    for(let j=Z-1;j>=1&&arr.length<G;j--)if(!arr.includes(j))arr.push(j);
    arr.sort((a,b)=>a-b);aisleIdx=arr;
  }
  let totalW=Z*blockW+wallGap*2;
  for(let i=1;i<=Z-1;i++)totalW+=aisleIdx.includes(i)?aisleW:gap;
  const totalD=blockD+2.8;
  const backZ=totalD/2,frontZ=-totalD/2;
  const midX=(door.value==='right')?totalW/2+0.2:-totalW/2-0.2;
  const xCenters=[];let x=-totalW/2+wallGap+blockW/2;
  for(let k=0;k<Z;k++){xCenters.push(x);x+=blockW+(aisleIdx.includes(k+1)?aisleW:gap);}

  const floor=new THREE.Mesh(new THREE.PlaneGeometry(totalW,totalD),new THREE.MeshStandardMaterial({color:COLORS.floor,roughness:.95}));
  floor.rotation.x=-Math.PI/2;scene.add(floor);
  const grid=new THREE.GridHelper(Math.max(totalW,totalD),Math.round(Math.max(totalW,totalD)),0x94a3b8,0xcbd5e1);grid.position.y=0.01;scene.add(grid);
  const zone=(x,w,color)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,totalD-0.6),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.13}));m.rotation.x=-Math.PI/2;m.position.set(x,0.02,0);scene.add(m);};
  const xA0=xCenters[0]-blockW/2,xA1=xCenters[HB-1]+blockW/2,xB0=xCenters[HB]-blockW/2,xB1=xCenters[Z-1]+blockW/2;
  zone((xA0+xA1)/2,xA1-xA0,0x3b82f6);zone((xB0+xB1)/2,xB1-xB0,0xf97316);

  const wallH=2.7,wallT=0.18;
  const wallMat=new THREE.MeshStandardMaterial({color:COLORS.wall,transparent:true,opacity:.5,roughness:.8});
  const wl=new THREE.Mesh(new THREE.BoxGeometry(wallT,wallH,totalD-1.6),wallMat);wl.position.set(midX,wallH/2,0);scene.add(wl);
  const frontWall=new THREE.Mesh(new THREE.BoxGeometry(totalW,wallH,wallT),new THREE.MeshStandardMaterial({color:0x475569,roughness:.9}));
  frontWall.position.set(0,wallH/2,frontZ);scene.add(frontWall);
  const bbW=Math.min(totalW*0.7,totalW-3);
  const bb=new THREE.Mesh(new THREE.BoxGeometry(bbW,1.5,0.12),new THREE.MeshStandardMaterial({color:COLORS.blackboard,roughness:.4}));
  bb.position.set(0,2.0,frontZ+0.12);scene.add(bb);
  const bbLabel=makeTextSprite('黑 板',{size:.7,color:'#e2e8f0',bg:null});bbLabel.position.set(0,2.0,frontZ+0.35);scene.add(bbLabel);
  const podium=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.95,1.1),new THREE.MeshStandardMaterial({color:COLORS.wood,roughness:.6}));
  podium.position.set(0,0.475,frontZ+1.0);scene.add(podium);
  const pLabel=makeTextSprite('讲 台',{size:.6,color:'#fff'});pLabel.position.set(0,1.15,frontZ+1.0);scene.add(pLabel);

  // 提醒横幅（黑板下沿墙面，三条左中右 + 备注下方）
  const ry=0.62;
  const mkRem=(text,x,y,color,bg)=>{const sp=makeTextSprite(text,{size:.5,color,bg});sp.position.set(x,y,frontZ+0.10);scene.add(sp);};
  mkRem(R1,-totalW*0.3,ry,'#dbeafe','rgba(37,99,235,0.9)');
  mkRem(R2,0,ry,'#fee2e2','rgba(220,38,38,0.9)');
  mkRem(R3,totalW*0.3,ry,'#fef3c7','rgba(217,119,6,0.9)');
  const mkDoor=(z,label)=>{const d=new THREE.Mesh(new THREE.BoxGeometry(0.14,2.2,1.05),new THREE.MeshStandardMaterial({color:0x94a3b8,roughness:.7}));d.position.set(midX,1.1,z);scene.add(d);
    const lab=makeTextSprite(label,{size:.5,color:'#fde68a'});lab.position.set(midX+(door.value==='right'?-0.8:0.8),2.5,z);scene.add(lab);};
  mkDoor(frontZ+0.9,'前门');mkDoor(backZ-0.9,'后门');

  const seats=new THREE.Group();scene.add(seats);
  const makeSeat=(x,z,color,text,isOcc)=>{
    const g=new THREE.Group();
    const table=new THREE.Mesh(new THREE.BoxGeometry(seatW-0.08,0.62,seatD-0.06),new THREE.MeshStandardMaterial({color,roughness:.75}));
    table.position.y=0.35;g.add(table);
    const top=new THREE.Mesh(new THREE.BoxGeometry(seatW-0.1,0.05,seatD-0.08),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.5}));
    top.position.y=0.69;g.add(top);
    const lab=makeTextSprite(isOcc?text:'机动',{size:.38,color:isOcc?'#1e293b':'#64748b',bg:isOcc?'rgba(255,255,255,0.96)':'rgba(226,232,240,0.9)'});
    lab.position.y=0.82;g.add(lab);
    g.position.set(x,0,z);seats.add(g);
  };
  for(let k=0;k<Z;k++){
    const isA=k<HB;const base=isA?S1:S2,limit=isA?N1:N2,local=k%HB;
    for(let r=0;r<R;r++){
      const z=frontZ+2.8+(r+0.5)*seatD;
      for(let c=0;c<C;c++){
        const idx=local*cap+r*C+c;
        const x=xCenters[k]-blockW/2+(c+0.5)*seatW;
        makeSeat(x,z,isA?COLORS.A:COLORS.B,base+idx,idx<limit);
      }
    }
    const blkLabel=(isA?A+'班':B+'班')+'·区'+(local+1);
    const lab=makeTextSprite(blkLabel,{size:.5,color:isA?'#bfdbfe':'#fed7aa'});
    lab.position.set(xCenters[k],0.55,frontZ+2.6-0.3);scene.add(lab);
  }
  // 过道标签
  for(const i of aisleIdx){
    const ax=(xCenters[i-1]+xCenters[i])/2;
    const lab=makeTextSprite('过道',{size:.42,color:'#94a3b8',bg:'rgba(15,23,42,0.6)'});
    lab.position.set(ax,0.9,-0.2);scene.add(lab);
  }
  const legendA=makeTextSprite(MAJ+' '+A+'班 · 左'+HB+'块',{size:.55,color:'#bfdbfe'});legendA.position.set((xA0+xA1)/2,0.5,backZ-0.5);scene.add(legendA);
  const legendB=makeTextSprite(MAJ+' '+B+'班 · 右'+HB+'块',{size:.55,color:'#fed7aa'});legendB.position.set((xB0+xB1)/2,0.5,backZ-0.5);scene.add(legendB);

  orbit={yaw:-0.5,pitch:0.5,dist:Math.max(totalW,totalD*(innerWidth/innerHeight))*1.08,target:new THREE.Vector3(0,0.9,0),auto:autoRotateOn};
  updateCamera();animate();
}
function updateCamera(){
  const cp=Math.cos(orbit.pitch),sp=Math.sin(orbit.pitch);
  camera.position.set(orbit.target.x+Math.sin(orbit.yaw)*cp*orbit.dist,orbit.target.y+sp*orbit.dist,orbit.target.z+Math.cos(orbit.yaw)*cp*orbit.dist);
  camera.lookAt(orbit.target);
}
function animate(){requestAnimationFrame(animate);if(orbit.auto)orbit.yaw+=0.0035;updateCamera();renderer.render(scene,camera);}
let dragging=false,px=0,py=0;
function bindDrag(){
  if(!renderer)return;
  renderer.domElement.addEventListener('mousedown',e=>{dragging=true;px=e.clientX;py=e.clientY;});
  renderer.domElement.addEventListener('touchstart',e=>{if(e.touches.length===1){dragging=true;px=e.touches[0].clientX;py=e.touches[0].clientY;}},{passive:true});
  renderer.domElement.addEventListener('touchmove',e=>{if(dragging&&e.touches.length===1){orbit.yaw-=(e.touches[0].clientX-px)*0.006;orbit.pitch+=(e.touches[0].clientY-py)*0.005;orbit.pitch=Math.max(0.05,Math.min(1.45,orbit.pitch));px=e.touches[0].clientX;py=e.touches[0].clientY;}},{passive:true});
  renderer.domElement.addEventListener('touchend',()=>dragging=false);
}
window.addEventListener('mousemove',e=>{if(!dragging||!orbit)return;orbit.yaw-=(e.clientX-px)*0.006;orbit.pitch+=(e.clientY-py)*0.005;orbit.pitch=Math.max(0.05,Math.min(1.45,orbit.pitch));px=e.clientX;py=e.clientY;});
window.addEventListener('mouseup',()=>dragging=false);
window.addEventListener('wheel',e=>{if(!orbit)return;orbit.dist*=1+e.deltaY*0.0012;orbit.dist=Math.max(8,Math.min(120,orbit.dist));},{passive:true});
window.addEventListener('resize',()=>{if(!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function setPair(x,y){va.value=x;vb.value=y;build();bindDrag();}
function rebuild(){build();bindDrag();}
function setView(v){if(!orbit)return;if(v==='overview'){orbit.yaw=-0.5;orbit.pitch=0.5;}else if(v==='front'){orbit.yaw=0;orbit.pitch=0.18;}else if(v==='top'){orbit.yaw=0;orbit.pitch=1.42;}else if(v==='side'){orbit.yaw=-Math.PI/2;orbit.pitch=0.45;}}
function toggleRotate(){if(!orbit)return;orbit.auto=!orbit.auto;document.getElementById('rotBtn').textContent='旋转: '+(orbit.auto?'开':'关');}
function toggleParams(){document.getElementById('params').classList.toggle('open');}
function print3d(){const o=orbit.auto;orbit.auto=false;updateCamera();setTimeout(()=>window.print(),60);setTimeout(()=>{orbit.auto=o;},1500);}
(function init(){
  const q=qp();
  major.value=q.major;va.value=q.a;vb.value=q.b;door.value=q.door;
  z.value=String(q.z);aisles.value=String(q.aisles);rows.value=q.rows;cols.value=q.cols;
  n1.value=q.n1;n2.value=q.n2;s1.value=q.s1;s2.value=q.s2;
  rem1.value=q.rem1;rem2.value=q.rem2;rem3.value=q.rem3;note.value=q.note;
  if(q.clean)document.documentElement.classList.add('clean');
  try{build();bindDrag();}catch(e){document.getElementById('err').style.display='block';document.getElementById('err').textContent='3D 引擎加载失败：'+(e&&e.stack?e.stack:e.message);}
})();
</script>
</body>
</html>
